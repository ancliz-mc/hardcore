plugins {
    id "java"
    id "com.gradleup.shadow" version "8.3.6"
    id "co.uzzu.dotenv.gradle" version "4.0.0"
}

group = "me.ancliz"
version = "0.2.1-SNAPSHOT"

def GRADLE_HOME = System.getenv("GRADLE_HOME")
def JAVA_LIB = System.getenv("JAVA_LIB")

ext {
    OUT_DIR = env.fetch("OUT_DIR", "build/libs")
}

repositories {
    mavenCentral()
    maven {
        name "essentialsx-releases"
        url "https://repo.essentialsx.net/releases/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = uri(JAVA_LIB)
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT"
    compileOnly "net.essentialsx:EssentialsX:2.20.1"
    compileOnly "me.ancliz:AnkyPlugin-annotations:0.0.1"
    implementation "me.ancliz:AnkyPlugin:0.1.1"
    implementation "me.ancliz:anky-util:0.0.1"
    annotationProcessor "me.ancliz:AnkyPlugin-processor:0.0.1"
}

apply from: GRADLE_HOME + "/scripts/ankyplugin.gradle"

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("plugin.yml") {
        expand props
    }
}